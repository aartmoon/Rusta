[package]
name = "rusta-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
bytes = "1"
crc32c = "0.6.9"
rusta-kafka = { path = "../rusta-kafka" }
rusta-log = { path = "../rusta-log" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
