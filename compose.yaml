services:
  broker:
    build: .
    image: rusta:local
    environment:
      RUSTA_ADVERTISED: 127.0.0.1:${RUSTA_PORT:-9092}
      RUSTA_INTERNAL_BIND: 0.0.0.0:29092
      RUSTA_INTERNAL_ADVERTISED: broker:29092
      RUSTA_GROUP_OFFSET_RETENTION_MS: "${RUSTA_GROUP_OFFSET_RETENTION_MS:-604800000}"
      RUSTA_DEBUG_CONNECTIONS: "${RUSTA_DEBUG_CONNECTIONS:-0}"
    ports:
      - "127.0.0.1:${RUSTA_PORT:-9092}:9092"
    volumes:
      - broker-data:/var/lib/rusta
    cpus: 1.0
    mem_limit: 256m
    healthcheck:
      test: [CMD, /usr/local/bin/rusta, healthcheck]
      interval: 2s
      timeout: 4s
      retries: 10
volumes:
  broker-data:
