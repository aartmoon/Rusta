name: Broker benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tests/java/pom.xml
      - run: python3 tests/bench/run.py "${RUNNER_TEMP}/rusta-bench"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: rusta-benchmark
          path: |
            ${{ runner.temp }}/rusta-bench/*.json
            ${{ runner.temp }}/rusta-bench/*.log
            ${{ runner.temp }}/rusta-bench/*/*.json
            ${{ runner.temp }}/rusta-bench/*/*.log
